quarkus:
  application:
    name: github-pulse
  banner:
    enabled: false
  log:
    level: WARN
    category:
      "io.quarkus.orbit.pulse":
        level: INFO
  langchain4j:
    ai:
      gemini:
        api-key: ${GEMINI_API_KEY}
        chat-model:
          model-id: gemini-2.5-flash
  datasource:
    db-kind: sqlite
    jdbc:
      url: jdbc:sqlite:pr_pulse_state.db?busy_timeout=5000&journal_mode=WAL
  hibernate-orm:
    database:
      generation: update

pr-pulse:
  global-threshold: 60
  github-token: ${GITHUB_TOKEN}
  lookback-days: 14

  repositories:
    - name: "smallrye-fault-tolerance"
      owner: "smallrye"
      description: "SmallRye Fault Tolerance - implementation of MicroProfile Fault Tolerance"
      rules:
        lines-changed-weight: 0.3
        critical-files-bonus: 25
        comment-activity-weight: 5
        max-size-score: 100
        feature-score: 45
        enhancement-score: 25
        bug-fix-score: 35
        critical-paths:
          - "implementation/core/src/main/java"
          - "implementation/fault-tolerance/src/main/java"
          - "api/src/main/java"

    - name: "smallrye-mutiny-vertx-bindings"
      owner: "smallrye"
      description: "Vert.x Mutiny API bindings and code generator"
      rules:
        lines-changed-weight: 0.2
        critical-files-bonus: 25
        comment-activity-weight: 5
        max-size-score: 100
        feature-score: 40
        enhancement-score: 25
        bug-fix-score: 30
        critical-paths:
          - "vertx-mutiny-code-generator/src/main/java"
          - "vertx-mutiny-clients/vertx-mutiny-core/src/main/java"

    - name: "smallrye-mutiny"
      owner: "smallrye"
      description: "SmallRye Mutiny - intuitive reactive programming library for Java"
      rules:
        lines-changed-weight: 0.4
        critical-files-bonus: 25
        comment-activity-weight: 5
        max-size-score: 100
