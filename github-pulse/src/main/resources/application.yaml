quarkus:
  application:
    name: github-pulse
  banner:
    enabled: false
  log:
    level: WARN
    category:
      "io.quarkus.orbit.pulse":
        level: INFO
  langchain4j:
    ai:
      gemini:
        api-key: ${GEMINI_API_KEY}
        chat-model:
          model-id: gemini-2.5-flash
  datasource:
    db-kind: sqlite
    jdbc:
      url: jdbc:sqlite:github_pulse.db
  hibernate-orm:
    schema-management:
      strategy: update

pr-pulse:
  global-threshold: 40
  github-token: ${GITHUB_TOKEN}
  lookback-days: 14
  repositories:
    - name: "smallrye-fault-tolerance"
      # https://github.com/smallrye/smallrye-fault-tolerance/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Fault Tolerance - implementation of MicroProfile Fault Tolerance"
      artifacts:
        - "io.smallrye:smallrye-fault-tolerance-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.40
        critical-path-weight: 0.25
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "implementation/core/src/main/java"
          - "implementation/fault-tolerance/src/main/java"
          - "api/src/main/java"

    - name: "smallrye-mutiny-vertx-bindings"
      # https://github.com/smallrye/smallrye-mutiny-vertx-bindings/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "Vert.x Mutiny API bindings and code generator"
      artifacts:
        - "io.smallrye.reactive:smallrye-mutiny-vertx-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "vertx-mutiny-code-generator/src/main/java"
          - "vertx-mutiny-clients/vertx-mutiny-core/src/main/java"

    - name: "smallrye-mutiny"
      # https://github.com/smallrye/smallrye-mutiny/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Mutiny - intuitive reactive programming library for Java"
      artifacts:
        - "io.smallrye.reactive:mutiny"
        - "io.smallrye.reactive:mutiny-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.20
        category-weight: 0.35
        critical-path-weight: 0.25
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "implementation/src/main/java/io/smallrye/mutiny"

    - name: "smallrye-graphql"
      # https://github.com/smallrye/smallrye-graphql/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye GraphQL - implementation of MicroProfile GraphQL"
      artifacts:
        - "io.smallrye:smallrye-graphql-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "server/implementation-cdi/src/main/java"
          - "server/implementation/src/main/java"
          - "client/implementation/src/main/java"
          - "common/schema-model/src/main/java"
          - "common/schema-builder/src/main/java"

    - name: "jandex"
      # https://github.com/smallrye/jandex/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "Java annotation indexer and offline reflection library"
      artifacts:
        - "io.smallrye:jandex"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.20
        category-weight: 0.35
        critical-path-weight: 0.25
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/src/main/java/org/jboss/jandex"

    - name: "smallrye-reactive-messaging"
      # https://github.com/smallrye/smallrye-reactive-messaging/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Reactive Messaging - framework for building event-driven applications"
      artifacts:
        - "io.smallrye.reactive:smallrye-reactive-messaging-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "smallrye-reactive-messaging-provider/src/main/java"
          - "smallrye-reactive-messaging-kafka/src/main/java"
          - "smallrye-reactive-messaging-rabbitmq/src/main/java"
          - "api/src/main/java"

    - name: "smallrye-open-api"
      # https://github.com/smallrye/smallrye-open-api/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye OpenAPI - implementation of MicroProfile OpenAPI"
      artifacts:
        - "io.smallrye:smallrye-open-api-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/src/main/java"
          - "extension-jaxrs/src/main/java"

    - name: "smallrye-stork"
      # https://github.com/smallrye/smallrye-stork/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Stork - service discovery and client-side load balancing"
      artifacts:
        - "io.smallrye.stork:stork-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/src/main/java"
          - "service-discovery"
          - "load-balancer"
          - "service-registration"

    - name: "smallrye-common"
      # https://github.com/smallrye/smallrye-common/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Common - shared utilities across SmallRye projects"
      artifacts:
        - "io.smallrye.common:*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.20
        category-weight: 0.35
        critical-path-weight: 0.25
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "classloader/src/main/java"
          - "resource/src/main/java"
          - "annotation/src/main/java"
          - "io/src/main/java"
          - "vertx4-context/src/main/java"
          - "vertx5-context/src/main/java"

    - name: "smallrye-config"
      # https://github.com/smallrye/smallrye-config/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Config - implementation of MicroProfile Config"
      artifacts:
        - "io.smallrye.config:*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.20
        category-weight: 0.40
        critical-path-weight: 0.20
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "implementation/src/main/java/io/smallrye/config"
          - "common/src/main/java"

    - name: "smallrye-jwt"
      # https://github.com/smallrye/smallrye-jwt/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye JWT - implementation of MicroProfile JWT Auth"
      artifacts:
        - "io.smallrye:smallrye-jwt-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "implementation/common/src/main/java"
          - "implementation/jwt-auth/src/main/java"
          - "implementation/jwt-build/src/main/java"

    - name: "smallrye-health"
      # https://github.com/smallrye/smallrye-health/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Health - implementation of MicroProfile Health"
      artifacts:
        - "io.smallrye:smallrye-health-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "implementation/src/main/java"

    - name: "smallrye-context-propagation"
      # https://github.com/smallrye/smallrye-context-propagation/releases
      owner: "smallrye"
      source: UPSTREAM
      description: "SmallRye Context Propagation - implementation of MicroProfile Context Propagation"
      artifacts:
        - "io.smallrye:smallrye-context-propagation-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.20
        category-weight: 0.35
        critical-path-weight: 0.25
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/src/main/java/io/smallrye/context"

    - name: "quarkus"
      # https://github.com/quarkusio/quarkus/releases
      owner: "quarkusio"
      source: QUARKUS
      description: "Quarkus - supersonic subatomic Java framework"
      artifacts:
        - "io.quarkus:*"
      release-strategy: RELEASE_NOTES
      rules:
        size-weight: 0.10
        category-weight: 0.40
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/deployment/src/main/java"
          - "core/runtime/src/main/java"
          - "independent-projects/arc"
          - "independent-projects/resteasy-reactive"
          - "independent-projects/tools"

    - name: "quarkus-http"
      owner: "quarkusio"
      source: QUARKUS
      description: "Quarkus HTTP - Undertow-based HTTP layer for Quarkus"
      artifacts:
        - "io.quarkus.http:*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/src/main/java"
          - "servlet/src/main/java"
          - "vertx/src/main/java"
          - "websocket/core/src/main/java"
          - "websocket/vertx/src/main/java"

    - name: "quarkus-mcp-server"
      # https://github.com/quarkiverse/quarkus-mcp-server/releases
      owner: "quarkiverse"
      source: QUARKIVERSE
      description: "Quarkus MCP Server - Model Context Protocol server extension"
      artifacts:
        - "io.quarkiverse.mcp:quarkus-mcp-server-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.15
        category-weight: 0.35
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/deployment/src/main/java"
          - "core/runtime/src/main/java"
          - "transports/http/runtime/src/main/java"
          - "transports/websocket/runtime/src/main/java"

    - name: "quarkus-langchain4j"
      # https://github.com/quarkiverse/quarkus-langchain4j/releases
      owner: "quarkiverse"
      source: QUARKIVERSE
      description: "Quarkus LangChain4j - LLM integration extension for Quarkus"
      artifacts:
        - "io.quarkiverse.langchain4j:quarkus-langchain4j-*"
      release-strategy: COMMIT_GRAPH
      rules:
        size-weight: 0.10
        category-weight: 0.40
        critical-path-weight: 0.30
        comment-weight: 0.20
        size-scale-factor: 8.1
        critical-paths:
          - "core/deployment/src/main/java"
          - "core/runtime/src/main/java"
          - "model-providers"

"%test":
  quarkus:
    langchain4j:
      ai:
        gemini:
          api-key: test-key
          chat-model:
            model-id: gemini-2.5-flash
  pr-pulse:
    github-token: test-token
