<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Group Issue Detection</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            padding: 20px 0;
        }

        .main-container {
            max-width: 1400px;
        }

        .btn-approve {
            border: 2px solid #198754;
            background: white;
            color: #198754;
        }

        .btn-approve:hover:not(.approved) {
            background: #e8f5e9;
            color: #198754;
            border-color: #198754;
        }

        .btn-approve.approved {
            background: #198754;
            color: white;
            border-color: #198754;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .btn-approve.approved:hover {
            background: #157347;
            border-color: #157347;
        }

        .issue-card:hover {
            background: #f8f9fa;
        }

        .accordion-content {
            margin-top: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap;
        }

        .config-code {
            font-family: monospace;
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
        }

        .stat-card {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #212529;
        }

        .loading-container {
            display: none;
        }

        .loading-container.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container main-container">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="mb-4">🤖 Working Group Issue Detection</h1>

                <!-- Controls -->
                <div class="d-flex gap-3 align-items-center mb-4">
                    <button id="runDetection" class="btn btn-primary">Run Detection</button>
                    <div id="loading" class="loading-container flex-grow-1">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <div class="spinner-border spinner-border-sm text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <small id="progressText" class="text-muted">Running detection...</small>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div id="progressFill" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Config Warnings -->
                <div id="configWarningsSection" style="display: none;">
                    <div class="card mb-3">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center"
                             style="cursor: pointer;"
                             data-bs-toggle="collapse"
                             data-bs-target="#configWarningsCollapse">
                            <div class="d-flex align-items-center gap-2">
                                <span id="configWarningsIcon">ℹ️</span>
                                <strong id="configWarningsHeaderText">Repository Configuration</strong>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-link text-decoration-none p-0"
                                        data-bs-toggle="collapse"
                                        data-bs-target="#configWarningsCollapse"
                                        onclick="event.stopPropagation()">
                                    <span id="configWarningsToggle">▼</span>
                                </button>
                                <button id="configWarningsClose" class="btn-close btn-sm" onclick="event.stopPropagation()"></button>
                            </div>
                        </div>
                        <div class="collapse show" id="configWarningsCollapse">
                            <div class="card-body" id="configWarnings"></div>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div id="statsSection" style="display: none;">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="card stat-card">
                                <div class="card-body">
                                    <div class="stat-label">Total</div>
                                    <div class="stat-value" id="statTotal">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card stat-card">
                                <div class="card-body">
                                    <div class="stat-label">Working Groups</div>
                                    <div class="stat-value" id="statWGs">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card stat-card">
                                <div class="card-body">
                                    <div class="stat-label">Approved</div>
                                    <div class="stat-value" id="statApproved">0</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div id="resultsSection" style="display: none;">
                    <div id="candidatesContainer"></div>

                    <div class="mt-4 pt-4 border-top text-end">
                        <button id="applyBtn" class="btn btn-success">Apply All Approved</button>
                        <div id="statusMessage" class="alert mt-3 d-none"></div>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="text-center py-5">
                    <div class="display-1 mb-3">🔍</div>
                    <p class="text-muted">Click "Run Detection" to start analyzing issues and PRs</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentRunId = null;
        let pollInterval = null;
        let candidatesData = {};
        let approvedItems = new Set(); // stores "wgName|issue.url" to track per-WG approval
        let cardIdCounter = 0;
        let warningsRendered = false;

        function approvalKey(wgName, issue) {
            return wgName + '|' + issue.url;
        }

        function generateSafeId(nodeId) {
            cardIdCounter++;
            return `card-${cardIdCounter}`;
        }

        // Setup config warnings close button
        document.getElementById('configWarningsClose').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('configWarningsSection').style.display = 'none';
        });

        // Update collapse icon
        const collapseEl = document.getElementById('configWarningsCollapse');
        collapseEl.addEventListener('show.bs.collapse', () => {
            document.getElementById('configWarningsToggle').textContent = '▼';
        });
        collapseEl.addEventListener('hide.bs.collapse', () => {
            document.getElementById('configWarningsToggle').textContent = '▶';
        });

        document.getElementById('runDetection').addEventListener('click', async () => {
            const btn = document.getElementById('runDetection');
            const loading = document.getElementById('loading');

            btn.disabled = true;
            loading.classList.add('active');
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('statsSection').style.display = 'none';
            document.getElementById('configWarningsSection').style.display = 'none';

            candidatesData = {};
            approvedItems.clear();
            warningsRendered = false;

            try {
                const response = await fetch('/api/detection/start?lookbackDays=14', {
                    method: 'POST'
                });
                const data = await response.json();
                currentRunId = data.id;

                pollDetectionProgress(currentRunId);

            } catch (error) {
                alert('Detection failed: ' + error.message);
                btn.disabled = false;
                loading.classList.remove('active');
            }
        });

        async function pollDetectionProgress(runId) {
            if (pollInterval) {
                clearInterval(pollInterval);
            }

            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/detection/${runId}`);
                    const run = await response.json();

                    document.getElementById('progressFill').style.width = run.progressPercent + '%';
                    document.getElementById('progressText').textContent = run.progressMessage || 'Running detection...';

                    // Only show warnings section if there are actual warnings
                    if (!warningsRendered && run.workingGroupsWithoutRepositories && run.workingGroupsWithoutRepositories.length > 0) {
                        renderConfigWarnings(run.workingGroupsWithoutRepositories);
                        document.getElementById('configWarningsSection').style.display = 'block';
                        warningsRendered = true;
                    }

                    if (run.status === 'COMPLETED' || run.status === 'FAILED') {
                        clearInterval(pollInterval);
                        pollInterval = null;

                        document.getElementById('runDetection').disabled = false;
                        document.getElementById('loading').classList.remove('active');

                        if (run.status === 'COMPLETED') {
                            await loadCandidates(runId);
                        } else {
                            alert('Detection failed: ' + (run.errorMessage || 'Unknown error'));
                        }
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 2000);
        }

        async function loadCandidates(runId) {
            const response = await fetch(`/api/detection/${runId}/candidates`);
            candidatesData = await response.json();

            updateStats();
            renderCandidates();

            document.getElementById('statsSection').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'block';
        }

        function renderConfigWarnings(wgsWithoutRepos) {
            const container = document.getElementById('configWarnings');
            const icon = document.getElementById('configWarningsIcon');
            const headerText = document.getElementById('configWarningsHeaderText');

            container.innerHTML = '';

            // Only render warnings (this function should only be called when there are warnings)
            icon.textContent = '⚠️';
            headerText.textContent = `Repository Configuration - ${wgsWithoutRepos.length} Warning${wgsWithoutRepos.length > 1 ? 's' : ''}`;

            wgsWithoutRepos.forEach(wgName => {
                const alert = document.createElement('div');
                alert.className = 'alert alert-warning mb-2';
                alert.innerHTML = `
                    ⚠️ <strong>${escapeHtml(wgName)}</strong> does not have a repository mapping configured.<br>
                    Add to <span class="config-code">application.yaml</span>:<br>
                    <span class="config-code">working-groups.repository-mapping."${escapeHtml(wgName)}":</span><br>
                    <span class="config-code">  - quarkusio/quarkus</span>
                `;
                container.appendChild(alert);
            });
        }

        function updateStats() {
            let totalCount = 0;
            const wgCount = Object.keys(candidatesData).length;

            Object.values(candidatesData).forEach(issues => {
                totalCount += issues.length;
            });

            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statWGs').textContent = wgCount;
            document.getElementById('statApproved').textContent = approvedItems.size;
        }

        function renderCandidates() {
            const container = document.getElementById('candidatesContainer');
            container.innerHTML = '';
            cardIdCounter = 0;

            if (Object.keys(candidatesData).length === 0) {
                container.innerHTML = '<div class="text-center py-5"><div class="display-1 mb-3">✅</div><p class="text-muted">No candidates found</p></div>';
                return;
            }

            Object.entries(candidatesData).forEach(([wgName, issues]) => {
                const wgCard = document.createElement('div');
                wgCard.className = 'card mb-3';

                const header = document.createElement('div');
                header.className = 'card-header bg-light';
                header.innerHTML = `<strong>${wgName}</strong> <span class="text-muted">(${issues.length} candidate${issues.length !== 1 ? 's' : ''})</span>`;
                wgCard.appendChild(header);

                const body = document.createElement('div');
                body.className = 'card-body p-0';

                issues.forEach((issue, index) => {
                    const issueDiv = createIssueCard(wgName, issue, index === issues.length - 1);
                    body.appendChild(issueDiv);
                });

                wgCard.appendChild(body);
                container.appendChild(wgCard);
            });
        }

        function createIssueCard(wgName, issue, isLast) {
            const card = document.createElement('div');
            card.className = 'issue-card p-3' + (isLast ? '' : ' border-bottom');

            const safeCardId = generateSafeId(issue.url);
            card.id = safeCardId;

            const typeLabel = issue.type === 'ISSUE' ? 'Issue' : 'PR';
            const badgeClass = issue.type === 'ISSUE' ? 'bg-primary' : 'bg-success';
            const key = approvalKey(wgName, issue);
            const isApproved = approvedItems.has(key);

            card.innerHTML = `
                <div class="d-flex align-items-start gap-3">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge ${badgeClass}">${typeLabel}</span>
                            <a href="${issue.url}" target="_blank" class="fw-semibold text-decoration-none">#${issue.number}</a>
                            <span class="fw-medium">${escapeHtml(issue.title)}</span>
                        </div>
                        ${issue.body ? `
                            <button class="btn btn-link btn-sm p-0 text-decoration-none accordion-toggle">
                                Show description
                            </button>
                            <div class="accordion-content collapse">
                                ${escapeHtml(issue.body || 'No description provided')}
                            </div>
                        ` : ''}
                    </div>
                    <button class="btn btn-sm btn-approve ${isApproved ? 'approved' : ''}" id="${safeCardId}-approve">
                        Approve
                    </button>
                </div>
            `;

            const accordionBtn = card.querySelector('.accordion-toggle');
            const accordionContent = card.querySelector('.accordion-content');
            if (accordionBtn && accordionContent) {
                accordionBtn.addEventListener('click', function() {
                    if (accordionContent.classList.contains('show')) {
                        accordionContent.classList.remove('show');
                        this.textContent = 'Show description';
                    } else {
                        accordionContent.classList.add('show');
                        this.textContent = 'Hide description';
                    }
                });
            }

            const approveBtn = card.querySelector('.btn-approve');
            approveBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                if (approvedItems.has(key)) {
                    approvedItems.delete(key);
                    approveBtn.classList.remove('approved');
                } else {
                    approvedItems.add(key);
                    approveBtn.classList.add('approved');
                }
                updateStats();
            });

            return card;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('applyBtn').addEventListener('click', async () => {
            const approvedByWG = {};

            Object.entries(candidatesData).forEach(([wgName, issues]) => {
                const approved = issues.filter(issue => approvedItems.has(approvalKey(wgName, issue)));
                if (approved.length > 0) {
                    approvedByWG[wgName] = approved;
                }
            });

            const totalApproved = Object.values(approvedByWG).reduce((sum, issues) => sum + issues.length, 0);

            if (totalApproved === 0) {
                alert('No approved items to apply');
                return;
            }

            if (!confirm(`Apply ${totalApproved} approved association(s) to GitHub? This cannot be undone.`)) {
                return;
            }

            const btn = document.getElementById('applyBtn');
            const statusMsg = document.getElementById('statusMessage');

            btn.disabled = true;
            statusMsg.classList.add('d-none');

            try {
                const response = await fetch(`/api/detection/${currentRunId}/apply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(approvedByWG)
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                statusMsg.textContent = `Successfully applied ${totalApproved} association(s) to GitHub!`;
                statusMsg.className = 'alert alert-success mt-3';
                statusMsg.classList.remove('d-none');

                Object.entries(approvedByWG).forEach(([wgName, issues]) => {
                    issues.forEach(issue => {
                        approvedItems.delete(approvalKey(wgName, issue));
                    });
                });

                updateStats();
                renderCandidates();

            } catch (error) {
                statusMsg.textContent = 'Failed to apply associations: ' + error.message;
                statusMsg.className = 'alert alert-danger mt-3';
                statusMsg.classList.remove('d-none');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
